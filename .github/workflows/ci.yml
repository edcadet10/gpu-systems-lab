name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU framework wheel
        run: >-
          python -m pip install 'torch>=2.10,<2.14'
          --index-url https://download.pytorch.org/whl/cpu
      - name: Install full validation dependencies
        run: python -m pip install -e '.[dev,gpu]'
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Run CPU and framework test suite
        run: pytest --cov=gpu_systems_lab --cov-report=term-missing
      - name: Run Triton interpreter contract test
        env:
          TRITON_INTERPRET: "1"
        run: pytest -m triton_interpreter -vv
      - name: Build distributions
        run: python -m build

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run dependency-free core suite
        run: >-
          pytest
          tests/test_benchmark_support.py
          tests/test_cli.py
          tests/test_result_schemas.py
          tests/test_ring_allreduce.py
          tests/test_roofline.py
          tests/test_traffic.py
